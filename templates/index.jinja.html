{% extends 'base.jinja.html' %}
{% block header_extra %}
    <div class="hero-text">
        <span class="eyebrow">{{ data.hero_text.eyebrow }}</span>
        <h2 class="headline">{{ data.hero_text.headline }}</h2>
        <p class="blurb">{{ data.hero_text.blurb }}</p>
    </div>
    <div class="cta-container">
        <a href="/shop.html" class="btn-shop">
            <span>Shop the Collection</span>
            <svg viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="3">
                <path d="M5 12h14M12 5l7 7-7 7" />
            </svg>
        </a>
    </div>
    <hr />
    {% endblock %}
{% block content %}
<main>
    <section class="gallery">
        {% for item in data.gallery %}
            <article class="gallery-item">
                <div class="img-container">
                  <img src="{{ data.asset_bucket_url }}{{ item.src }}" alt="{{ item.alt }}" />
                </div>
                <p class="caption">{{ item.caption }}</p>
            </article>
        {% endfor %}
    </section>
</main>
{% endblock %}
