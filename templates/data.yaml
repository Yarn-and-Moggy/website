  info:
    cost: Every item in our shop is crocheted by hand — a machine that can crochet does not exist. A single toy can take several hours to make. The price reflects the time, skill, and love that goes into each one.
    safety: All our toys are made with cat safety in mind. We use pet-safe materials throughout. As with any toy, we recommend supervised play and checking regularly for wear and tear.
