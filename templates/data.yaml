  shop:
    headline: The Collection
    blurb: Limited runs of handmade catnip joy, all made with 100% cotton yarn.
    aside: All items are handmade and pieces will have natural variation.

  product_copy:
    - All Yarn & Moggy toys are made with 100% cotton yarn and potent organic catnipt for maximum engagement.
    - We are working towards using all our waste yarn to create recycled stuffing, though some regular polyester toy stuffing may still be used during this transitional period

  footer: Handmade with Catnip & Love • Nottingham, UK
  api_url: https://api.yarnandmoggy.co.uk
  bucket_url: ""
  # ENSURE TRAILING /
  asset_bucket_url: "https://assets.yarnandmoggy.co.uk/"

  info:
    cost: Every item in our shop is crocheted by hand — a machine that can crochet does not exist. A single toy can take several hours to make. The price reflects the time, skill, and love that goes into each one.
    safety: All our toys are made with cat safety in mind. We use pet-safe materials throughout. As with any toy, we recommend supervised play and checking regularly for wear and tear.
  faq:
    - question: How long will my order take?
      answer: Some items are made to order by hand, so please allow up to 7 days for dispatch. Once dispatched, we ship via Royal Mail Tracked 48 — typically 2-3 business days. You'll receive an email when your order is on its way.
    - question: Why does crochet cost more?
      answer: "{{ data.info.cost }}"
    - question: Are the toys safe for my cat?
      answer: "{{ data.info.safety }}"
    - question: Can I request a custom order?
      answer: "Sometimes! Drop us a message on Instagram and we'll let you know what's possible."
    - question: Where do you deliver to and how much will it cost?
      answer: We ship to anywhere within the UK. We ship with Royal Mail tracked 48 and charge £4 delivery, which covers our costs for additional packaging.
