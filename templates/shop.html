<!-- Shop Main Grid -->
<main class="shop-container">
    <header class="shop-header">
        <h1 class="headline">The Collection</h1>
        <p class="blurb">Limited runs of handmade catnip joy.</p>
    </header>

    <div id="product-grid" class="product-grid" data-next-cursor="{{ data.products_response.next_cursor or '' }}">
        {% for product in data.products_response.products %}
            {{ product_card(product, data.bucket_url) }}
        {% endfor %}
    </div>

    <!-- The Sentinel for Lazy Loading -->
    <div id="load-more-sentinel" style="height: 20px;"></div>
</main>

<script>
    // Minimal Lazy Loader for next_cursor
    const grid = document.getElementById('product-grid');
    const sentinel = document.getElementById('load-more-sentinel');
    let nextCursor = grid.dataset.nextCursor;

    const observer = new IntersectionObserver(async (entries) => {
        if (entries[0].isIntersecting && nextCursor) {
            const response = await fetch(`{{ data.api_url }}/products?cursor=${nextCursor}`);
            const data = await response.json();
            
            nextCursor = data.next_cursor;
            
            // Usage in your fetch loop:
            // const html = data.products.map(p => createProductCard(p, data.bucket_url)).join('');
            // grid.insertAdjacentHTML('beforeend', html);
        }
    });

    observer.observe(sentinel);

  function createProductCard(product, bucketUrl = null) {
      // Renders a product card based on the ProductListing data model
      let imgUrl = product.thumbnail_url;
      
      // Localstack override logic
      // Can sub out localhost:4566
      if (bucketUrl) {
          const fileName = imgUrl.split('/').pop();
          imgUrl = `${bucketUrl}/products/${product.slug}/${fileName}`;
      }

      const price = (product.price_pence / 100).toFixed(2);
      const isOutOfStock = !product.in_stock;

      return `
          <article class="shop-item" data-slug="${product.slug}">
              <div class="shop-img-container ${isOutOfStock ? 'out-of-stock' : ''}">
                  <img src="${imgUrl}" alt="${product.name}" loading="lazy">
                  ${isOutOfStock ? '<span class="stock-badge">Sold Out</span>' : ''}
                  <button class="quick-add" ${isOutOfStock ? 'disabled' : ''} 
                          onclick="handleQuickAdd('${product.slug}')">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                          <path d="M12 5v14M5 12h14"/>
                      </svg>
                  </button>
              </div>
              <div class="shop-item-info">
                  <h3>${product.name}</h3>
                  <p class="price">£${price}</p>
              </div>
          </article>
      `;
  }

</script>
