<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yarn & Moggy | Catnip Infused Crochet Toys</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <nav>
        <a href="#" class="social-link">Instagram</a>
      </nav>

      <div class="logo-container">
        <img src="assets/logo.svg" alt="Yarn & Moggy Logo" id="logo" />
        <div class="dots-container">
          <span class="dot pink"></span>
          <span class="dot blue"></span>
          <span class="dot yellow"></span>
        </div>
        <h1 class="visually-hidden">Yarn & Moggy</h1>
      </div>

      <hr />

      <div class="hero-text">
        <span class="eyebrow">Premium Catnip Infused</span>
        <h2 class="headline">Toys that make them purr.</h2>
        <p class="blurb">Handcrafted Amigurumi Crochet. Coming Soon.</p>
      </div>
    </header>

    <main>
      <section class="gallery">
        <article class="gallery-item">
          <div class="img-container">
            <img
              src="assets/img1.jpeg"
              alt="Frankie playing with Yarn & Moggy toy"
            />
          </div>
          <p class="caption">The Playtest</p>
        </article>

        <article class="gallery-item">
          <div class="img-container">
            <img src="assets/img2.jpeg" alt="Crochet detail of cat toy" />
          </div>
          <p class="caption">Catnip Infused</p>
        </article>

        <article class="gallery-item">
          <div class="img-container">
            <img
              src="assets/img3.jpeg"
              alt="Sam playing with Yarn & Moggy toy"
            />
          </div>
          <p class="caption">Slow-made by hand</p>
        </article>
      </section>
    </main>

    <footer>
      <p>Handmade with Catnip &amp; Love &bull; Nottingham, UK</p>
    </footer>
  </body>
</html>
