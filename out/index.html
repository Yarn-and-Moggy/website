    />
    <meta property="og:title" content="Yarn & Moggy" />

    <meta name="twitter:image" content="assets/og_logo.png" />
    <meta name="twitter:image:alt" content="Yarn & Moggy logo" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link
      rel="apple-touch-icon"

  <body>
    <header>
      <nav id="header-nav">
        <div class="nav-left">
          <p class="clowder-text">Join the Clowder!</p>
        </div>
        
        <div class="nav-center">
          
            <a href="https://www.instagram.com/yarnandmoggy" class="social_link" target="_blank">
              Instagram
            </a>
          
            <a href="https://www.facebook.com/profile.php?id=61588603917369" class="social_link" target="_blank">
              Facebook
            </a>
          
        </div>
        
        <div class="nav-right">
          <!-- Reserved for future use (Probably Cart) -->
        </div>
      </nav>

      <div class="logo-container">
        <img
          src="assets/logo.svg"
          alt="Yarn & Moggy Logo"
          id="logo"
        />
        <div class="dots-container">
          <span class="dot pink"></span>
          <span class="dot blue"></span>
          <span class="dot yellow"></span>
        </div>
        <h1 class="visually-hidden">Yarn & Moggy</h1>
      </div>

      <hr />

      <div class="hero-text">
        <span class="eyebrow">Premium Catnip Infused</span>
        <h2 class="headline">Toys that make them purr.</h2>
        <p class="blurb">Handcraft Amigurumi Crochet. Coming Soon.</p>
      </div>
      <div class="cta-container">
          <a href="/shop" class="btn-shop">
              <span>Shop the Collection</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                  <path d="M5 12h14M12 5l7 7-7 7"/>
              </svg>
          </a>
      </div>
      <hr />
    </header>

    <main>
      <section class="gallery">
        
        <article class="gallery-item">
          <div class="img-container">
            <img src="assets/img1.jpeg" alt="Frankie playing with Yarn & Moggy toy" />
          </div>
          <p class="caption">The Playtest</p>
        </article>
        
        <article class="gallery-item">
          <div class="img-container">
            <img src="assets/img2.jpeg" alt="Crochet detail of cat toy" />
          </div>
          <p class="caption">Catnip Infused</p>
        </article>
        
        <article class="gallery-item">
          <div class="img-container">
            <img src="assets/img3.jpeg" alt="Sam playing with Yarn & Moggy toy" />
          </div>
          <p class="caption">Slow-made by hand</p>
        </article>
        
      </section>

    <footer>
      <p>Handmade with Catnip & Love • Nottingham, UK</p>
    </footer>
